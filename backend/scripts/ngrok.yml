# ==============================================================================
# Button Factory MES - ngrok Tunnel Configuration (Remote Owner Access)
# Usage: ngrok start --config backend/scripts/ngrok.yml button-factory-mes
# ==============================================================================
version: "2"
# Replace with your actual auth token from dashboard.ngrok.com
# authtoken: "YOUR_NGROK_AUTH_TOKEN"

tunnels:
  button-factory-mes:
    proto: http
    addr: 80 # Tunnels Caddy port 80 (serves Flutter Web, API, and Media)
    inspect: false
    bind_tls: true
    # Note: Flutter api_client already sends header 'ngrok-skip-browser-warning: true'
