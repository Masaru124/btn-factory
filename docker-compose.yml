services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: btn_factory_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=sqlite:////app/data/btn_factory.db
      - SECRET_KEY=change-this-secret-key-in-production-use-a-long-random-string
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - CORS_ORIGINS=*
    volumes:
      - backend_data:/app/data

volumes:
  backend_data:
    driver: local
