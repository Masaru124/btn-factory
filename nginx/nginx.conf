# Button Factory MES - Backend Reverse Proxy Nginx Configuration
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Gzip Compression for backend JSON and text responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript;

    # Upstream FastAPI Backend
    upstream backend_api {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    server {
        listen       8080;
        server_name  testtt234e.duckdns.org localhost 127.0.0.1;

        # Allow large image and file uploads up to 50MB
        client_max_body_size 50M;

        # Reverse Proxy all traffic directly to FastAPI Backend (:8000)
        location / {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 60s;
        }
    }
}
