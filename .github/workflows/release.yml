name: Publish Release

on:
  push:
    branches:
      - main

jobs:
  check-commit:
    name: Check Commit Message
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag_name: ${{ steps.check.outputs.tag_name }}
    steps:
      - name: Check message
        id: check
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          echo "Commit message: $COMMIT_MSG"
          if echo "$COMMIT_MSG" | grep -qi "\[release\]" || echo "$COMMIT_MSG" | grep -Eiq "release:[[:space:]]*v[0-9]+\.[0-9]+(\.[0-9]+)?"; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            TAG=$(echo "$COMMIT_MSG" | grep -Eio "release:[[:space:]]*v[0-9]+\.[0-9]+(\.[0-9]+)?" | grep -Eio "v[0-9]+\.[0-9]+(\.[0-9]+)?" || echo "")
            if [ -z "$TAG" ]; then
              TAG="v0.0.${{ github.run_number }}"
            fi
            echo "tag_name=$TAG" >> $GITHUB_OUTPUT
            echo "Release version: $TAG"
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "No release trigger found."
          fi

  build-android:
    name: Build Android
    needs: check-commit
    if: needs.check-commit.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: btn_factory
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            btn_factory/build/app/outputs/flutter-apk/app-release.apk
            btn_factory/build/app/outputs/bundle/release/app-release.aab

  build-windows:
    name: Build Windows
    needs: check-commit
    if: needs.check-commit.outputs.should_release == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: btn_factory
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows Build
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath btn_factory_windows.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: btn_factory/btn_factory_windows.zip

  build-linux:
    name: Build Linux
    needs: check-commit
    if: needs.check-commit.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: btn_factory
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Package Linux Build
        run: |
          tar -czf btn_factory_linux.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: btn_factory/btn_factory_linux.tar.gz

  build-macos:
    name: Build macOS
    needs: check-commit
    if: needs.check-commit.outputs.should_release == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: btn_factory
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Package macOS Build
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../btn_factory_macos.zip btn_factory.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: btn_factory/btn_factory_macos.zip

  build-ios:
    name: Build iOS
    needs: check-commit
    if: needs.check-commit.outputs.should_release == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: btn_factory
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS (IPA)
        run: flutter build ipa --release --no-codesign

      - name: Package iOS Build
        run: |
          cd build/ios/archive
          zip -r ../../../btn_factory_ios.zip Runner.xcarchive

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: btn_factory/btn_factory_ios.zip

  create-release:
    name: Create Release
    needs: [check-commit, build-android, build-windows, build-linux, build-macos, build-ios]
    if: needs.check-commit.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-commit.outputs.tag_name }}
          name: Release ${{ needs.check-commit.outputs.tag_name }}
          files: |
            artifacts/android-release/app-release.apk
            artifacts/android-release/app-release.aab
            artifacts/windows-release/btn_factory_windows.zip
            artifacts/linux-release/btn_factory_linux.tar.gz
            artifacts/macos-release/btn_factory_macos.zip
            artifacts/ios-release/btn_factory_ios.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
